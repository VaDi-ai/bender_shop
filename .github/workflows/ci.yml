name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    # Тестовая БД для интеграционных тестов (ADMIN-DESIGN §10.6).
    # URL совпадает с прежним «non-connecting dummy» — юнит-тесты как не
    # коннектились, так и не коннектятся; интеграционные гейтятся INTEGRATION_DB.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Prisma client is gitignored (generated/prisma) and imported across the
      # codebase; without this, tsc can't resolve its types and fails.
      # Mirrors `prebuild: prisma generate` that the Railway build already runs.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      # Prisma 7: у db push нет --skip-generate (см. railway.toml) — generate выше уже отработал
      - name: Push schema to test DB
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Run tests
        run: npm test
        env:
          ENCRYPTION_KEY_V1: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          INTEGRATION_DB: '1'
