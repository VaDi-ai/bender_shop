# https://docs.railway.com/guides/config-as-code
[build]
builder = "NIXPACKS"

[deploy]
# Явный healthcheck быстрее редиректа / → /shop; без npm-обёртки меньше шума по SIGTERM.
healthcheckPath = "/health"
healthcheckTimeout = 120
startCommand = "npx prisma db push --skip-generate && node dist/bot/index.js"
# Дублируем на фазе release (если включена в проекте).
releaseCommand = "npx prisma db push --skip-generate"
