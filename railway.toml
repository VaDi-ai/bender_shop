# https://docs.railway.com/guides/config-as-code
[build]
builder = "NIXPACKS"

[deploy]
# Явный healthcheck быстрее редиректа / → /shop; без npm-обёртки меньше шума по SIGTERM.
healthcheckPath = "/health"
healthcheckTimeout = 120
startCommand = "node dist/bot/index.js"
# Синхронизация схемы с БД (в репо нет migrations — db push; при появлении migrate заменить на migrate deploy).
releaseCommand = "npx prisma db push"
