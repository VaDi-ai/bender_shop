# https://docs.railway.com/guides/config-as-code
#
# ВАЖНО: persistent Volume в сервисе не должен монтироваться в /app или /app/dist —
# иначе остаётся старый dist и в логах снова prisma.region / битые ApiKey.
[build]
builder = "NIXPACKS"

[deploy]
# Явный healthcheck быстрее редиректа / → /shop; без npm-обёртки меньше шума по SIGTERM.
healthcheckPath = "/health"
healthcheckTimeout = 120
# Prisma 7: у db push нет флага --skip-generate (ломало контейнер).
# generate + push: на Railway dist иногда собирается без актуального generated-клиента относительно schema.
startCommand = "npx prisma generate && npx prisma db push && node dist/bot/index.js"
releaseCommand = "npx prisma generate && npx prisma db push"
