# https://docs.railway.com/guides/config-as-code
#
# ВАЖНО: persistent Volume в сервисе не должен монтироваться в /app или /app/dist —
# иначе остаётся старый dist и в логах снова prisma.region / битые ApiKey.
[build]
builder = "NIXPACKS"
# Явная сборка: без свежего `tsc` в образе не будет dist/, а старый кэш Nixpacks теоретически мог подставить артефакт.
buildCommand = "npm run build"

[deploy]
# Явный healthcheck быстрее редиректа / → /shop; без npm-обёртки меньше шума по SIGTERM.
healthcheckPath = "/health"
healthcheckTimeout = 120
# СХЕМНЫХ ОПЕРАЦИЙ В startCommand НЕТ (урок #107: start-time db push упал на
# unique-констрейнте, старый контейнер уже был погашен из-за Volume → 20 мин 502).
# db push живёт ТОЛЬКО в releaseCommand; рестарт контейнера схему не трогает.
# prisma generate на старте оставлен намеренно: клиент запекается в образ на
# build (prebuild), но исторический край с Volume, подкладывающим старый /app,
# лечится связкой generate + verify-dist — оба без обращения к БД.
startCommand = "npx prisma generate && node scripts/verify-dist.cjs && node dist/bot/index.js"
releaseCommand = "npx prisma generate && npx prisma db push"
