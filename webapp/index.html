<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bender Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0a;
      --surface:  #1a1a1a;
      --border:   #333333;
      --text:     #ffffff;
      --hint:     #888888;
      --accent:   #a8ff3e;
      --accent-fg:#0a0a0a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo { font-size: 17px; font-weight: 700; }
    .cart-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .cart-btn:active { border-color: var(--accent); }
    .cart-badge {
      background: var(--accent);
      color: var(--accent-fg);
      border-radius: 10px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }
    .cart-badge[data-count="0"] { display: none; }

    /* ── Categories ─────────────────────────────────────────────────── */
    .categories {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      background: var(--bg);
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn {
      white-space: nowrap;
      flex-shrink: 0;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .cat-btn.active {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
      font-weight: 600;
    }

    /* ── Product Grid ───────────────────────────────────────────────── */
    .products {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px 16px 100px;
    }

    @keyframes cardIn {
      from { transform: translateY(28px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: cardIn 300ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .product-photo {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
    }
    .product-photo-ph {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      background: var(--surface);
    }
    .product-info {
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .product-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .product-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
    }
    .add-btn {
      margin-top: auto;
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: 9px;
      padding: 9px 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: transform 150ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .add-btn:active { transform: scale(0.95); }

    /* ── Empty / Loader ─────────────────────────────────────────────── */
    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 0;
      color: var(--hint);
      font-size: 15px;
    }

    /* ── Overlay ────────────────────────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .overlay.show { opacity: 1; pointer-events: all; }

    /* ── Cart Bottom Sheet ──────────────────────────────────────────── */
    .cart-sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 200;
      background: var(--bg);
      border-top: 1px solid var(--border);
      border-radius: 18px 18px 0 0;
      max-height: 88vh;
      overflow-y: auto;
      padding: 0 16px 32px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(.32,.72,0,1);
    }
    .cart-sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 38px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 12px auto 18px;
    }
    .cart-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }

    /* Cart items */
    .cart-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name {
      font-size: 14px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cart-item-sub { font-size: 13px; color: var(--hint); margin-top: 2px; }
    .qty-ctrl { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .qty-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 20px; line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s;
    }
    .qty-btn:active { border-color: var(--accent); color: var(--accent); }
    .qty-val { font-size: 16px; font-weight: 600; min-width: 22px; text-align: center; }

    /* Empty cart */
    .cart-empty {
      text-align: center;
      padding: 32px 0;
      color: var(--hint);
      font-size: 16px;
    }

    /* Section title */
    .section-label {
      font-size: 13px; font-weight: 600; letter-spacing: 0.3px;
      color: var(--hint);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* Payment buttons */
    .pay-group { display: flex; gap: 8px; margin-bottom: 18px; }
    .pay-btn {
      flex: 1;
      padding: 12px 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s, background 0.15s, color 0.15s, transform 150ms cubic-bezier(0.34, 1.56, 0.64, 1);
      line-height: 1.4;
    }
    .pay-btn:active { transform: scale(0.97); }
    .pay-btn.sel {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-fg);
      font-weight: 700;
    }
    .pay-btn .pay-icon { display: block; font-size: 20px; margin-bottom: 4px; }

    /* Commission breakdown */
    .comm-breakdown {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      padding-top: 0;
      padding-bottom: 0;
      transition: max-height 0.3s ease, opacity 0.25s ease, padding 0.25s ease;
    }
    .comm-breakdown.show {
      max-height: 120px;
      opacity: 1;
      padding: 12px 14px;
    }
    .comm-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; color: var(--hint); }
    .comm-row .comm-label { }
    .comm-row .comm-val { color: #ff6b6b; font-weight: 600; }

    /* Total block */
    .total-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }
    .total-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; color: var(--hint); }
    .total-row.main {
      border-top: 1px solid var(--border);
      margin-top: 6px;
      padding-top: 10px;
      color: var(--text);
    }
    .total-row.main span { font-size: 16px; font-weight: 700; }
    .total-row.main .total-amount { color: var(--accent); }

    /* Checkout btn */
    .checkout-btn {
      width: 100%;
      padding: 15px;
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: 13px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 150ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s;
    }
    .checkout-btn:disabled { opacity: 0.35; cursor: default; }
    .checkout-btn:not(:disabled):active { transform: scale(0.97); }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <span class="header-logo">🎩 Bender Shop</span>
    <button class="cart-btn" id="cartBtn">
      🛒 <span class="cart-badge" id="cartBadge" data-count="0">0</span>
    </button>
  </header>

  <!-- Categories -->
  <nav class="categories" id="cats">
    <button class="cat-btn active" data-cat="">Все</button>
    <button class="cat-btn" data-cat="Телефоны">📱 Телефоны</button>
    <button class="cat-btn" data-cat="Ноутбуки">💻 Ноутбуки</button>
    <button class="cat-btn" data-cat="Игры">🎮 Игры</button>
    <button class="cat-btn" data-cat="Часы">⌚ Часы</button>
    <button class="cat-btn" data-cat="Аудио">🔊 Аудио</button>
  </nav>

  <!-- Products -->
  <main class="products" id="grid">
    <div class="state-msg">Загрузка…</div>
  </main>

  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Cart Sheet -->
  <div class="cart-sheet" id="cartSheet">
    <div class="sheet-handle"></div>
    <h2 class="cart-title">🛒 Корзина</h2>

    <!-- Empty state -->
    <div class="cart-empty" id="cartEmpty">Корзина пуста</div>

    <!-- Filled state -->
    <div id="cartFilled" style="display:none">
      <div class="cart-list" id="cartList"></div>

      <p class="section-label">Способ оплаты</p>
      <div class="pay-group">
        <button class="pay-btn" data-method="cash">
          <span class="pay-icon">💵</span>Наличные
        </button>
        <button class="pay-btn" data-method="transfer">
          <span class="pay-icon">📲</span>Перевод
        </button>
        <button class="pay-btn" data-method="card">
          <span class="pay-icon">💳</span>Карта
        </button>
      </div>

      <!-- Card commission breakdown -->
      <div class="comm-breakdown" id="commBreakdown">
        <div class="comm-row">
          <span class="comm-label">Сумма товаров</span>
          <span class="comm-val" id="commSubtotal">0 ₽</span>
        </div>
        <div class="comm-row">
          <span class="comm-label">Комиссия за эквайринг (14%)</span>
          <span class="comm-val" id="commFee">0 ₽</span>
        </div>
      </div>

      <div class="total-block" id="totalBlock">
        <div class="total-row">
          <span>Товары</span>
          <span id="subtotalVal">0 ₽</span>
        </div>
        <div class="total-row main">
          <span>Итого</span>
          <span class="total-amount" id="totalVal">0 ₽</span>
        </div>
      </div>

      <button class="checkout-btn" id="checkoutBtn" disabled>Оформить заказ</button>
    </div>
  </div>

  <script>
    // ── Telegram WebApp init ─────────────────────────────────────────
    const tg = window.Telegram && window.Telegram.WebApp
    if (tg) { tg.ready(); tg.expand() }

    // ── State ────────────────────────────────────────────────────────
    let allProducts = []
    let cart = []       // { id, name, price, qty }
    let payMethod = ''

    // ── Helpers ──────────────────────────────────────────────────────
    function fmt(n) {
      return Number(n).toLocaleString('ru-RU')
    }

    const CAT_EMOJI = { 'Телефоны':'📱','Ноутбуки':'💻','Игры':'🎮','Часы':'⌚','Аудио':'🔊' }
    function catEmoji(c) { return CAT_EMOJI[c] || '📦' }

    function subtotal() {
      return cart.reduce((s, i) => s + Number(i.price) * i.qty, 0)
    }
    function total() {
      const s = subtotal()
      return payMethod === 'card' ? s * 1.14 : s
    }

    // ── Load products ────────────────────────────────────────────────
    async function loadProducts(cat) {
      const grid = document.getElementById('grid')
      grid.innerHTML = '<div class="state-msg">Загрузка…</div>'
      try {
        const url = cat ? `/api/products?category=${encodeURIComponent(cat)}` : '/api/products'
        const res = await fetch(url)
        allProducts = await res.json()
        renderGrid()
      } catch {
        grid.innerHTML = '<div class="state-msg">Не удалось загрузить товары</div>'
      }
    }

    function renderGrid() {
      const grid = document.getElementById('grid')
      if (!allProducts.length) {
        grid.innerHTML = '<div class="state-msg">Товаров нет</div>'
        return
      }
      grid.innerHTML = allProducts.map((p, i) => {
        const photoHtml = p.photoUrl
          ? `<img class="product-photo" src="${p.photoUrl}" alt="" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`
          : ''
        const phStyle = p.photoUrl ? 'style="display:none"' : ''
        const delay = i * 60
        return `
          <div class="product-card" style="animation-delay:${delay}ms">
            ${photoHtml}
            <div class="product-photo-ph" ${phStyle}>${catEmoji(p.category)}</div>
            <div class="product-info">
              <div class="product-name">${p.name}</div>
              <div class="product-price">${fmt(p.price)} ₽</div>
              <button class="add-btn" onclick="addToCart(${p.id})">Взять у Бендера</button>
            </div>
          </div>`
      }).join('')
    }

    // ── Cart logic ───────────────────────────────────────────────────
    function addToCart(productId) {
      const p = allProducts.find(x => x.id === productId)
      if (!p) return
      const ex = cart.find(i => i.id === productId)
      if (ex) { ex.qty++ } else { cart.push({ id: p.id, name: p.name, price: p.price, qty: 1 }) }
      updateBadge()
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light')
    }

    function updateBadge() {
      const n = cart.reduce((s, i) => s + i.qty, 0)
      const badge = document.getElementById('cartBadge')
      badge.textContent = n
      badge.dataset.count = n
    }

    function changeQty(idx, d) {
      cart[idx].qty += d
      if (cart[idx].qty <= 0) cart.splice(idx, 1)
      updateBadge()
      renderCartSheet()
    }

    // ── Cart sheet ───────────────────────────────────────────────────
    function openCart() {
      renderCartSheet()
      document.getElementById('cartSheet').classList.add('open')
      document.getElementById('overlay').classList.add('show')
    }
    function closeCart() {
      document.getElementById('cartSheet').classList.remove('open')
      document.getElementById('overlay').classList.remove('show')
    }

    function renderCartSheet() {
      const empty = document.getElementById('cartEmpty')
      const filled = document.getElementById('cartFilled')
      if (!cart.length) {
        empty.style.display = 'block'
        filled.style.display = 'none'
        return
      }
      empty.style.display = 'none'
      filled.style.display = 'block'

      document.getElementById('cartList').innerHTML = cart.map((item, i) => `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-sub">${fmt(item.price)} ₽ × ${item.qty} = ${fmt(Number(item.price) * item.qty)} ₽</div>
          </div>
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
            <span class="qty-val">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
          </div>
        </div>`).join('')

      updateTotals()
    }

    function updateTotals() {
      const sub = subtotal()
      const comm = payMethod === 'card' ? sub * 0.14 : 0
      const tot = sub + comm

      document.getElementById('subtotalVal').textContent = fmt(sub) + ' ₽'
      document.getElementById('totalVal').textContent = fmt(tot) + ' ₽'

      // Card breakdown
      const breakdown = document.getElementById('commBreakdown')
      if (payMethod === 'card') {
        document.getElementById('commSubtotal').textContent = fmt(sub) + ' ₽'
        document.getElementById('commFee').textContent = '+' + fmt(comm) + ' ₽'
        breakdown.classList.add('show')
      } else {
        breakdown.classList.remove('show')
      }

      document.getElementById('checkoutBtn').disabled = !payMethod || !cart.length
    }

    // ── Payment selection ────────────────────────────────────────────
    document.querySelectorAll('.pay-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.pay-btn').forEach(b => b.classList.remove('sel'))
        btn.classList.add('sel')
        payMethod = btn.dataset.method
        updateTotals()
      })
    })

    // ── Checkout ─────────────────────────────────────────────────────
    document.getElementById('checkoutBtn').addEventListener('click', async () => {
      if (!payMethod || !cart.length) return
      const btn = document.getElementById('checkoutBtn')
      btn.disabled = true
      btn.textContent = 'Оформляем…'

      const telegramId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user)
        ? String(tg.initDataUnsafe.user.id)
        : ''

      const totalAmt = total().toFixed(2)
      const items = cart.map(i => ({ productId: i.id, name: i.name, price: i.price, qty: i.qty }))

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telegramId, items, totalAmount: totalAmt, payment: payMethod }),
        })
        const json = await res.json().catch(() => ({}))
        const orderId = json.orderId || 0

        const payload = JSON.stringify({
          orderId,
          items,
          payment: payMethod,
          total: totalAmt,
        })

        if (tg && tg.sendData) {
          tg.sendData(payload)
        } else {
          alert('Заказ #' + orderId + ' принят!')
          btn.textContent = '✅ Оформлено'
        }
      } catch {
        btn.disabled = false
        btn.textContent = 'Оформить заказ'
        alert('Ошибка оформления. Попробуйте ещё раз.')
      }
    })

    // ── Category tabs ────────────────────────────────────────────────
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'))
        btn.classList.add('active')
        loadProducts(btn.dataset.cat)
      })
    })

    // ── Event listeners ──────────────────────────────────────────────
    document.getElementById('cartBtn').addEventListener('click', openCart)
    document.getElementById('overlay').addEventListener('click', closeCart)

    // ── Init ─────────────────────────────────────────────────────────
    loadProducts('')
  </script>
</body>
</html>
